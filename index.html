oes','Observações','textarea']]},agenda:{title:'Agenda e Prazos',icon:'🗓️',fields:[['titulo','Compromisso','text',1],['data','Data e hora','datetime-local',1],['tipo','Tipo','select',0,'Sessão pública|Envio de proposta|Pedido de esclarecimento|Impugnação|Recurso|Diligência|Certidão|Outro'],['processo','Processo','process'],['responsavel','Responsável'],['feito','Situação','select',0,'Pendente|Concluído'],['observacoes','Observações','textarea']]},resultados:{title:'Contratos e Resultados',icon:'🏆',fields:[['processo','Processo','process'],['empresa','Empresa','company'],['status','Resultado','select',0,'Vencedora|Perdida|Homologada|Adjudicada|Contratada|Encerrada'],['valor','Valor contratado R$','number'],['contrato','Número do contrato'],['inicio','Início','date'],['fim','Fim','date'],['observacoes','Observações','textarea']]}};

let db=load(),users=loadUsers(),session=sessionStorage.getItem(SESS),page='dashboard',filter='',modal=null,pncpRows=[],radarLoading=false,radarError='',radarFilter='',rMonth=new Date(),analisado='',editFile=null;let prefs=JSON.parse(localStorage.getItem('licitapro-prefs')||'{}');if(prefs.dark)document.body.classList.add('dark');function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object')return {...base(),...d}}catch(e){}return base()}function base(){return{empresas:[],processos:[],documentos:[],propostas:[],agenda:[],resultados:[],favorites:[],settings:{nome:'Minha empresa',alertDays:15}}}function loadUsers(){try{let a=JSON.parse(localStorage.getItem(USERS));return Array.isArray(a)?a:[]}catch(e){return[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Sem espaço no navegador. Faça backup e exclua registros antigos.')}}function saveUsers(){localStorage.setItem(USERS,JSON.stringify(users))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(s){if(!s)return '—';const d=new Date(s.length===10?s+'T12:00:00':s);return isNaN(d)?esc(s):d.toLocaleDateString('pt-BR')+(s.includes('T')?' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'')}function uid(){return (crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2))}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000)}function me(){return users.find(x=>x.id===session)}function canEdit(){return me()?.role!=='Consulta'}function canAdmin(){return me()?.role==='Administrador'}function today(){return new Date().toISOString().slice(0,10)}function days(dateString){return Math.ceil((new Date(dateString.slice(0,10)+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}function pill(s){let v=String(s||'');let cl=/vencid|conclu|ganh|aprov|contrat|homolog|adjudic/i.test(v)?'green':/perdid|expir|urgente/i.test(v)?'red':/análise|pendente|rascunho/i.test(v)?'orange':'';return `<span class="pill ${cl}">${esc(v)}</span>`}function heading(title,sub='',buttons=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}function newBtn(k){return canEdit()?`<button class="btn" onclick="openForm('${k}')">＋ Novo cadastro</button>`:''}function render(){if(!session||!me()){return renderLogin()}const n=navs.find(x=>x[0]===page);document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img src="icon.png" alt="LicitaPro"><div><strong>Licita<span>Pro</span></strong><small>INTELIGÊNCIA EM LICITAÇÕES</small></div></div><div class="navlist">${navs.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="goto('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}</div></aside><main class="main"><div class="top"><div class="small">🔒 Dados locais neste navegador · ${esc(db.settings.nome)}</div><div class="actions"><span class="small">${esc(me().name)} (${esc(me().role)})</span><button class="btn alt sm" onclick="toggleDark()">◐ Tema</button><button class="btn alt sm" onclick="logout()">Sair</button></div></div><section class="content" id="content">${view()}</section></main></div>${modal||''}`;setupEvents()}

function renderLogin(){let first=users.length===0;document.getElementById('app').innerHTML=`<div class="login"><div class="card"><div class="loginbrand"><img src="icon.png"> LicitaPro</div><p style="text-align:center">${first?'Configuração inicial deste computador':'Acesso ao sistema local'}</p><form onsubmit="login(event)"><div class="stack">${first?'<div><label>Nome do administrador</label><input class="input" name="name" required minlength="2"></div>':''}<div><label>Usuário</label><input class="input" name="username" autocomplete="username" required></div><div><label>Senha ${first?'(mínimo 8 caracteres)':''}</label><input class="input" name="password" type="password" autocomplete="current-password" required ${first?'minlength="8"':''}></div><button class="btn" type="submit">${first?'Criar administrador':'Entrar'}</button></div></form><div class="help small">⚠️ Versão local: a proteção por senha é básica e não substitui a segurança de um servidor. Use conta separada no Windows, bloqueio do computador e backups protegidos. O armazenamento do navegador pode ser apagado.</div></div></div>`}async function digest(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function login(ev){ev.preventDefault();const f=new FormData(ev.target),username=String(f.get('username')).trim(),password=String(f.get('password'));if(!users.length){users=[{id:uid(),name:String(f.get('name')).trim(),username,hash:await digest(password),role:'Administrador'}];saveUsers();toast('Administrador criado. Faça backup regularmente.')}const u=users.find(x=>x.username.toLowerCase()===username.toLowerCase()&&x.hash);if(u&&u.hash===await digest(password)){session=u.id;sessionStorage.setItem(SESS,session);render()}else toast('Usuário ou senha inválidos')}function logout(){session=null;sessionStorage.removeItem(SESS);render()}
function view(){if(entities[page])return listing(page);return ({dashboard,radar,analise,relatorios,usuarios,config,ajuda})[page]?.()||dashboard()}
function dashboard(){let due=[...db.agenda.filter(x=>x.feito!=='Concluído').map(x=>({titulo:x.titulo,data:x.data})),...db.documentos.filter(x=>x.validade).map(x=>({titulo:'Validade: '+x.nome,data:x.validade}))].filter(x=>x.data).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,7);const metrics=[['Oportunidades salvas',db.favorites.length,'◎'],['Processos em andamento',db.processos.filter(x=>!['Encerrada','Perdida','Vencida'].includes(x.status)).length,'▤'],['Propostas cadastradas',db.propostas.length,'▦'],['Licitações vencidas',db.resultados.filter(x=>x.status==='Vencedora').length,'🏆']];return heading('Bem-vindo ao LicitaPro','Central de gestão e inteligência em licitações públicas',`<button class="btn alt" onclick="backup()">⇩ Fazer backup</button>`) + `<div class="grid">${metrics.map(m=>`<div class="card"><div class="metricline"><div class="small">${m[0]}</div><span class="symbol">${m[2]}</span></div><div class="metric">${m[1]}</div><div class="small">Registros reais deste computador</div></div>`).join('')}</div><div class="split"><div class="card"><h2>Processos recentes</h2>${smallTable('processos',db.processos.slice(-7).reverse())}</div><div class="card"><h2>Próximos vencimentos</h2>${due.length?due.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><b>${esc(x.titulo)}</b><div class="small">${date(x.data)} ${days(x.data)<0?'<span class="dangertext"> · Vencido</span>':days(x.data)<=7?' · Atenção':''}</div></div>`).join(''):'<div class="empty">Nenhum prazo registrado</div>'}<button class="btn alt" style="margin-top:15px" onclick="goto('agenda')">Abrir agenda</button></div></div><div class="grid three" style="margin-top:17px">${[['radar','◎','Radar de Licitações','Consultar oportunidades do PNCP'],['analise','✧','Analisar Edital','Ler e organizar exigências'],['propostas','▦','Propostas','Calcular preços e exportar PDF']].map(x=>`<div class="card"><span class="symbol">${x[1]}</span><h3 style="margin-top:13px">${x[2]}</h3><p>${x[3]}</p><button class="btn" onclick="goto('${x[0]}')">Acessar</button></div>`).join('')}</div>`}
function smallTable(k,arr){return arr.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Referência</th><th>Descrição</th><th>Situação</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.numero||x.nome||x.titulo||'—')}</td><td>${esc(x.objeto||x.descricao||x.orgao||'—')}</td><td>${pill(x.status||x.tipo||'—')}</td><td><button class="btn alt sm" onclick="openForm('${k}','${x.id}')">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum cadastro. Comece adicionando o primeiro registro.</div>'}
function listing(k){const d=entities[k];let rows=db[k].filter(x=>Object.values(x).join(' ').toLowerCase().includes(filter.toLowerCase()));let spec=k==='propostas'?`<div class="notice">Preço sugerido = (custo total por item, frete e despesas + tributos configurados) ajustado pela margem sobre venda. Valide a fórmula com o financeiro e os tributos aplicáveis. A proposta oficial deve seguir o edital.</div>`:k==='documentos'?`<div class="notice">Anexos podem ser associados aos documentos e ficam guardados no armazenamento do navegador (IndexedDB), sujeitos aos limites do dispositivo. Backup JSON exporta registros, não arquivos anexos.</div>`:'';return heading(d.title,`${db[k].length} registro(s) salvo(s) neste computador`,newBtn(k)+`<button class="btn alt" onclick="exportCSV('${k}')">Exportar Excel/CSV</button>`) + spec + `<div class="card" style="margin-top:15px"><div class="toolbar"><input class="input" id="filterBox" placeholder="Pesquisar registros..." value="${esc(filter)}"><button class="btn alt" onclick="document.getElementById('filterBox').value='';filter='';render()">Limpar</button></div>${rows.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Referência</th><th>Descrição</th><th>Empresa / Órgão</th><th>Valor / Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.numero||x.nome||x.titulo||x.contrato||'—')}</b></td><td>${esc(x.objeto||x.descricao||x.razao||x.tipo||x.processo||'—')}</td><td>${esc(x.orgao||x.empresa||x.nome||'—')}</td><td>${k==='propostas'?money(price(x)):x.valor?money(x.valor):date(x.abertura||x.data||x.validade||x.fim)}</td><td>${pill(k==='documentos'&&x.validade&&days(x.validade)<0?'Vencido':x.status||x.feito||'Registrado')}</td><td><div class="actions"><button class="btn alt sm" onclick="openForm('${k}','${x.id}')">Editar</button>${k==='propostas'?`<button class="btn alt sm" onclick="printProposal('${x.id}')">PDF</button>`:''}${canEdit()?`<button class="btn alt sm" onclick="removeRecord(' function extractPoints(){analisado=document.getElementById('editText')?.value||'';if(!analisado.trim())return toast('Cole ou importe texto primeiro');const groups=[['Objeto',/objeto|contratação|fornecimento/i],['Prazos e sessões',/abertura|sessão|proposta|prazo|impugnação/i],['Habilitação',/habilitação|habilitacao|regularidade|certid|fgts/i],['Capacidade técnica',/atestado|capacidade técnica|qualificação técnica/i],['Entrega e execução',/entrega|execução|fornecimento|prazo de entrega/i],['Pagamento e garantias',/pagamento|garantia|faturamento/i],['Multas e sanções',/multa|sanção|penalidade/i],['Critério de julgamento',/menor preço|maior desconto|técnica e preço|julgamento/i]];let lines=analisado.replace(/\s+/g,' ').split(/(?<=[.!?;])\s+/);extracted=groups.map(([name,re])=>({name,matches:lines.filter(x=>re.test(x)).slice(0,3).map(x=>x.slice(0,280))}));document.getElementById('analysisOutput').innerHTML=analysisOutput();toast('Pontos encontrados. Confira as referências no documento original.')}function downloadAnalysis(){analisado=document.getElementById('editText')?.value||analisado;download(analisado,'LicitaPro_Leitura_Edital.txt','text/plain;charset=utf-8')}
async function loadScript(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}async function readEdital(){let file=document.getElementById('editalFile')?.files[0];if(!file)return toast('Selecione um arquivo');try{if(/\.(txt|md)$/i.test(file.name)){analisado=await file.text()}else if(/\.pdf$/i.test(file.name)){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let parts=[];for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();parts.push('=== PÁGINA '+i+' ===\n'+c.items.map(t=>t.str).join(' '))}analisado=parts.join('\n\n')}else if(/\.docx$/i.test(file.name)){if(!window.mammoth)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');let r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});analisado=r.value}else throw Error('Tipo de arquivo não suportado');document.getElementById('editText').value=analisado;extractPoints();toast('Arquivo processado. Verifique o conteúdo extraído.')}catch(e){toast('Não foi possível ler o arquivo: '+e.message+'. Para PDFs digitalizados é necessário OCR externo.')}}

function config(){return heading('Configurações','Preferências, dados e manutenção')+`<div class="grid two"><div class="card"><h2>Personalização</h2><form onsubmit="saveConfig(event)"><div class="stack"><div><label>Identificação da empresa / ambiente</label><input class="input" name="nome" value="${esc(db.settings.nome)}"></div><div><label>Antecedência para alertas (dias)</label><input class="input" type="number" name="alertDays" min="1" max="365" value="${esc(db.settings.alertDays)}"></div><button class="btn">Salvar configurações</button></div></form></div><div class="card"><h2>Dados e backup</h2><p>Dados armazenados localmente no navegador e neste perfil de usuário do computador.</p><div class="stack"><button class="btn" onclick="backup()">⇩ Exportar backup JSON</button><button class="btn alt" onclick="importBackup()">⇧ Restaurar backup JSON</button><button class="btn alt" onclick="toggleDark()">◐ Alternar claro/escuro</button>${canAdmin()?'<button class="btn danger" onclick="clearData()">Limpar todos os cadastros</button>':''}</div></div></div><div class="notice" style="margin-top:16px">Backup JSON inclui cadastros, mas não inclui senhas nem arquivos anexos do IndexedDB. Mantenha cópias protegidas dos PDFs originais e dos backups em outra unidade. Não abra o aplicativo em navegação anônima.</div>`}
function saveConfig(e){e.preventDefault();Object.assign(db.settings,Object.fromEntries(new FormData(e.target).entries()));save();render();toast('Configurações atualizadas')}function clearData(){if(!canAdmin())return;let val=prompt('Para apagar os registros, digite APAGAR:');if(val==='APAGAR'){db=base();save();render();toast('Todos os cadastros foram removidos. Anexos armazenados separadamente permanecem até serem removidos.')}}
function ajuda(){return heading('Ajuda e Orientações','Manual rápido do LicitaPro')+`<div class="grid two"><div class="card"><h2>Primeiros passos</h2><p><b>1.</b> Cadastre sua empresa em Empresas.</p><p><b>2.</b> Consulte o Radar PNCP ou cadastre um processo manualmente.</p><p><b>3.</b> Associe documentos e anote vencimentos.</p><p><b>4.</b> Prepare itens de propostas e faça conferência financeira.</p><p><b>5.</b> Cadastre eventos na agenda e resultados.</p><p><b>6.</b> Exporte backup periodicamente.</p></div><div class="card"><h2>O que funciona nesta versão</h2><p>✓ Dashboard e indicadores reais dos cadastros</p><p>✓ CRUD de processos, empresas, documentos, propostas, agenda e resultados</p><p>✓ Consulta ao PNCP se o navegador permitir a conexão</p><p>✓ Leitura de TXT e leitura de PDF/DOCX com bibliotecas carregadas pela internet</p><p>✓ Pesquisa de trechos no edital (não é IA generativa)</p><p>✓ Exportação CSV, impressão de proposta em PDF, backups JSON</p><p>✓ Usuários locais e modos claro/escuro</p><p>✓ Anexos opcionais em IndexedDB</p></div></div><div class="card" style="margin-top:15px"><h2>Limitações importantes</h2><p>• O navegador não é um banco de dados vitalício, e limpar os dados do site ou usar outro perfil pode remover os registros.</p><p>• O controle de login é demonstrativo; dados sensíveis devem ser protegidos com criptografia do disco e sistema operacional.</p><p>• Não há alertas em segundo plano, disparos de e-mail nem lances automáticos.</p><p>• Consultas podem falhar por bloqueio CORS ou indisponibilidade do PNCP.</p><p>• Não há serviço de IA generativa integrado. A conferência dos editais continua responsabilidade do analista.</p><p>• Para funcionamento plenamente profissional com segurança e backups automáticos, será necessária versão com backend.</p><p>Documentação oficial do PNCP: <a target="_blank" rel="noopener" href="https://pncp.gov.br/api/consulta/swagger-ui/index.html">API de consultas</a></p></div>`}
// Banco de anexos: IndexedDB isolado do backup JSON.
function fileDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('licitapro-anexos-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function saveAttachment(id){let f=document.getElementById('docUpload')?.files[0];if(!f)return toast('Selecione o anexo');try{let d=await fileDB(),tx=d.transaction('files','readwrite');tx.objectStore('files').put(f,id);await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j});let x=db.documentos.find(x=>x.id===id);if(x){x.arquivoNome=f.name;save()}toast('Anexo guardado neste navegador');openForm('documentos',id)}catch(e){toast('Falha ao salvar anexo: '+e.message)}}async function getAttachment(id){try{let d=await fileDB(),tx=d.transaction('files','readonly'),req=tx.objectStore('files').get(id);req.onsuccess=()=>{if(!req.result)return toast('Não há anexo salvo');let u=URL.createObjectURL(req.result),a=document.createElement('a');a.href=u;a.download=req.result.name||'anexo';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};req.onerror=()=>toast('Erro ao ler anexo')}catch(e){toast('Falha ao acessar anexo')}}
// Substituir visualização da agenda por calendário, além da tabela de eventos.
const originalListing=listing;listing=function(k){if(k!=='agenda')return originalListing(k);let monthName=rMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return heading('Agenda e Prazos','Calendário das sessões e atividades registradas',newBtn('agenda'))+`<div class="card"><div class="metricline" style="margin-bottom:20px"><h2 style="margin:0;text-transform:capitalize">${monthName}</h2><div class="actions"><button class="btn alt sm" onclick="moveMonth(-1)">◀</button><button class="btn alt sm" onclick="rMonth=new Date();render()">Hoje</button><button class="btn alt sm" onclick="moveMonth(1)">▶</button></div></div><div class="calendar">${agendaMonth()}</div></div><div style="margin-top:16px">${originalListing(k)}</div>`};function moveMonth(n){rMonth=new Date(rMonth.getFullYear(),rMonth.getMonth()+n,1);render()}
render();
</script></body></html>
